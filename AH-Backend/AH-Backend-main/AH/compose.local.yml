services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anjaneya_herbals
      POSTGRES_USER: anjaneya
      POSTGRES_PASSWORD: anjaneya_local_only
    ports:
      - "5432:5432"
    volumes:
      - ah-postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ah-ollama-data:/root/.ollama

volumes:
  ah-postgres-data:
  ah-ollama-data:
