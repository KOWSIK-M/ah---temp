# Default developer profile: Java runs on the host; PostgreSQL and Ollama run
# through compose.local.yml. Every value remains overrideable from a local .env.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/anjaneya_herbals}
    username: ${DATABASE_USERNAME:anjaneya}
    password: ${DATABASE_PASSWORD:anjaneya_local_only}
  jpa:
    show-sql: true
  ai:
    openai:
      # Ollama's OpenAI-compatible endpoint. It ignores this non-secret key.
      api-key: ${AI_CHAT_API_KEY:ollama}
      base-url: ${AI_CHAT_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_CHAT_MODEL:llama3.2}

ai:
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:ollama}
    base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
    # mxbai-embed-large produces 1024 dimensions, matching pgvector config.
    model: ${AI_EMBEDDING_MODEL:mxbai-embed-large}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  show-error-details: true

cookie:
  secure: false

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.ah.web: DEBUG
