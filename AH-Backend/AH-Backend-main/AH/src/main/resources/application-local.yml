# Default developer profile: Java runs on the host; PostgreSQL and the small
# Ollama embedding model run through compose.local.yml.
spring:
  autoconfigure:
    exclude:
      # Local RAG selects reviewed passages deterministically; no chat LLM is loaded.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/anjaneya_herbals}
    username: ${DATABASE_USERNAME:anjaneya}
    password: ${DATABASE_PASSWORD:anjaneya_local_only}
  jpa:
    show-sql: true
  ai:
    vectorstore:
      pgvector:
        # This profile owns a separate, lightweight local vector index dimension.
        dimensions: 384

ai:
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:ollama}
    base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
    # all-minilm is a 46 MB local embedding model with 384 dimensions.
    model: ${AI_EMBEDDING_MODEL:all-minilm}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  show-error-details: true

cookie:
  secure: false

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.ah.web: DEBUG
