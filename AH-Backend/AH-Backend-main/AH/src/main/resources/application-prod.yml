# Production Profile - PostgreSQL Database
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            # Vercel proxies the OAuth callback to Cloud Run. Pin the public
            # HTTPS URI because the proxy's backend host is otherwise used.
            redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:https://anjaneya-herbals.vercel.app/login/oauth2/code/google}

cookie:
  secure: ${COOKIE_SECURE:true} # Required for SameSite=None (Cross-site Vercel <-> Render)

# Security - Override in environment
jwt:
  secret: ${JWT_SECRET}

# CORS - Frontend domain
cors:
  allowed-origins: ${CORS_ORIGINS:https://anjaneya-herbals.vercel.app}

logging:
  level:
    com.ah.web: INFO
    org.springframework.security: WARN

app:
  frontend-url: ${APP_FRONTEND_URL}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:https://anjaneya-herbals.vercel.app/oauth2/redirect}
