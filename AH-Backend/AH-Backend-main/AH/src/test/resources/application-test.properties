spring.datasource.url=jdbc:h2:mem:ah_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.jpa.defer-datasource-initialization=true
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.mail.username=test@example.com
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.access-expiration=900000
jwt.refresh-expiration=604800000
cors.allowed-origins=http://localhost:5173
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
razorpay.key.id=test
razorpay.key.secret=test
app.frontend-url=http://localhost:5173
logging.level.root=WARN

management.health.mail.enabled=false
